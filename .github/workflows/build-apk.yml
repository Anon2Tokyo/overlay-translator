name: Build and Output APK

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Debug and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper jar
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Setup local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Output APK information
        run: |
          mkdir -p outputs
          cp app/build/outputs/apk/debug/app-debug.apk outputs/ScreenTranslator-debug.apk
          cd outputs
          sha256sum ScreenTranslator-debug.apk > ScreenTranslator-debug.apk.sha256
          ls -lh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-APK
          path: |
            outputs/ScreenTranslator-debug.apk
            outputs/ScreenTranslator-debug.apk.sha256
          retention-days: 30
